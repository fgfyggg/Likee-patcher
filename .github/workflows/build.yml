name: Patch APK with Frida

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install frida-tools objection

      - name: Download APK from release
        run: |
          curl -L -o Likee.apk "https://github.com/fgfyggg/Likee-patcher/releases/download/v1.0/Likee_5.55.1.apk"

      - name: Patch APK
        run: |
          objection patchapk -s Likee.apk

      - name: Upload Patched APK
        uses: actions/upload-artifact@v4
        with:
          name: frida-patched-apk
          path: "*.apk"
