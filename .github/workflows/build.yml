name: Patch APK with Frida

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install frida-tools objection tomllib

      - name: Download APK from release
        run: |
          curl -L -o LikeeLite.apk "https://github.com/fgfyggg/Likee-patcher/releases/download/v2.0/Likee.Lite_3.8.7.apk"

      - name: Patch APK
        run: |
          objection patchapk -s LikeeLite.apk

      - name: Upload Patched APK
        uses: actions/upload-artifact@v4
        with:
          name: frida-patched-apk
          path: "*.apk"
